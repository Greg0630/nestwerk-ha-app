name: FamilyBoard
version: "0.15.0"
slug: nestwerk
description: Familien-App für Einkaufslisten und Kalender
arch:
  - aarch64
  - amd64
image: ghcr.io/greg0630/nestwerk
startup: application
boot: auto
# SQLite sicher sichern: App während des Backups kurz anhalten.
backup: cold
homeassistant_api: true
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Weboberfläche (Ziel für den Cloudflare Tunnel)
webui: http://[HOST]:[PORT:8765]/
options:
  google_client_id: ""
  google_client_secret: ""
schema:
  google_client_id: str?
  google_client_secret: password?
